<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preload" as="image" href="abstract.svg">
    <title>Antigravity Interactive Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-image: url('abstract.svg') !important;
            background-size: cover !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 400px;
            z-index: 2;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 5px;
            color: #152235;
            opacity: 0.6;
            pointer-events: none;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .watermark::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: linear-gradient(135deg, #424242, #424242);
        }
    </style>
</head>

<body>

    <canvas id="antigravity-canvas"></canvas>

    <div class="watermark">
        Projekt Traum Powered By Antigravity
    </div>

    <script>
        const canvas = document.getElementById('antigravity-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, targetX: -1000, targetY: -1000, active: false };

        const PARTICLE_COUNT = 90;
        const MAX_CONNECT_DIST = 130;
        const MOUSE_RADIUS = 180;
        const MOUSE_REPULSE_FORCE = 3.5;

        const PALETTE = [
            { r: 99, g: 102, b: 241, a: 0.6 }, // Indigo
            { r: 14, g: 165, b: 233, a: 0.6 }, // Sky
            { r: 168, g: 85, b: 247, a: 0.5 }, // Purple
            { r: 16, g: 185, b: 129, a: 0.5 }, // Emerald
            { r: 244, g: 63, b: 94, a: 0.4 }  // Rose
        ];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        class Particle {
            constructor() {
                this.reset(true);
            }

            reset(initial = false) {
                this.x = Math.random() * width;
                this.y = initial ? Math.random() * height : height + 20;
                this.radius = Math.random() * 3.5 + 1.5;

                // Antigravity drift (upwards) + gentle horizontal float
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = -(Math.random() * 0.5 + 0.2); // upward drift

                this.baseVx = this.vx;
                this.baseVy = this.vy;

                this.color = PALETTE[Math.floor(Math.random() * PALETTE.length)];
                this.pulseSpeed = Math.random() * 0.02 + 0.005;
                this.pulseFactor = Math.random() * Math.PI;
                this.mass = this.radius * 0.8;
            }

            update() {
                // Sine wave floating effect
                this.pulseFactor += this.pulseSpeed;
                const waveX = Math.sin(this.pulseFactor) * 0.2;

                // Mouse interaction (Antigravity repulsion force)
                if (mouse.active) {
                    const dx = this.x - mouse.x;
                    const dy = this.y - mouse.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < MOUSE_RADIUS && dist > 0) {
                        const force = (1 - dist / MOUSE_RADIUS) * MOUSE_REPULSE_FORCE;
                        const angle = Math.atan2(dy, dx);

                        this.vx += (Math.cos(angle) * force) / this.mass;
                        this.vy += (Math.sin(angle) * force) / this.mass;
                    }
                }

                // Apply velocity with air resistance / damping returning to base drift
                this.vx = this.vx * 0.95 + (this.baseVx + waveX) * 0.05;
                this.vy = this.vy * 0.95 + this.baseVy * 0.05;

                this.x += this.vx;
                this.y += this.vy;

                // Wrap boundaries (Antigravity floating out of top respawns at bottom)
                if (this.y < -30) {
                    this.y = height + 20;
                    this.x = Math.random() * width;
                }
                if (this.x < -30) this.x = width + 30;
                if (this.x > width + 30) this.x = -30;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${this.color.a})`;
                ctx.shadowBlur = 12;
                ctx.shadowColor = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.5)`;
                ctx.fill();
                ctx.shadowBlur = 0; // reset
            }
        }

        function init() {
            resize();
            particles = [];
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                particles.push(new Particle());
            }
        }

        function drawBackground() {
            // Czyścimy płótno, zamiast je zamalowywać gradientem
            ctx.clearRect(0, 0, width, height);

            // Zachowujemy subtelną poświatę wokół myszki
            if (mouse.active) {
                const mouseGlow = ctx.createRadialGradient(
                    mouse.x, mouse.y, 0,
                    mouse.x, mouse.y, MOUSE_RADIUS * 1.5
                );
                mouseGlow.addColorStop(0, 'rgba(99, 102, 241, 0.08)');
                mouseGlow.addColorStop(0.5, 'rgba(14, 165, 233, 0.04)');
                mouseGlow.addColorStop(1, 'rgba(248, 250, 252, 0)');
                ctx.fillStyle = mouseGlow;
                ctx.fillRect(0, 0, width, height);
            }
        }

        function drawConnections() {
            for (let i = 0; i < particles.length; i++) {
                for (let j = i + 1; j < particles.length; j++) {
                    const p1 = particles[i];
                    const p2 = particles[j];
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < MAX_CONNECT_DIST) {
                        const alpha = (1 - dist / MAX_CONNECT_DIST) * 0.25;
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(99, 102, 241, ${alpha})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        }

        function animate() {
            // Smooth mouse interpolation
            mouse.x += (mouse.targetX - mouse.x) * 0.15;
            mouse.y += (mouse.targetY - mouse.y) * 0.15;

            drawBackground();
            drawConnections();

            for (const particle of particles) {
                particle.update();
                particle.draw();
            }

            requestAnimationFrame(animate);
        }

        // Event listeners
        window.addEventListener('resize', resize);

        window.addEventListener('mousemove', (e) => {
            mouse.targetX = e.clientX;
            mouse.targetY = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
            mouse.targetX = -1000;
            mouse.targetY = -1000;
        });

        // Touch support
        window.addEventListener('touchmove', (e) => {
            if (e.touches.length > 0) {
                mouse.targetX = e.touches[0].clientX;
                mouse.targetY = e.touches[0].clientY;
                mouse.active = true;
            }
        });

        init();
        animate();
    </script>
</body>

</html>
